<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Monstars Playground</title>

    <link rel="stylesheet" href="monstar.css" />
    <script src="monstar.js" defer></script>
  </head>

  <body>
    <header>
      <h1>Monstars</h1>
    </header>

    <main>
      <section class="monster-stage">
        <img
          id="bunny"
          class="monster bunny"
          src="Bunny.svg"
          alt="Bunny"
          draggable="false"
        />

        <img
          id="drummer"
          class="monster drummer"
          src="Drummer.svg"
          alt="Drummer"
          draggable="false"
        />

        <img
          id="duckler"
          class="monster duckler"
          src="Duckler.svg"
          alt="Duckler"
          draggable="false"
        />

        <img
          id="guitar"
          class="monster guitar"
          src="Guitar Monster.svg"
          alt="Guitar Monster"
          draggable="false"
        />

        <div id="monking" class="monster monking">
          <img
            id="monking-idle"
            src="Monking.svg"
            alt="Monking"
            draggable="false"
          />

          <video
            id="monking-playing"
            muted
            loop
            playsinline
          >
            <source src="Monking(play).mp4" type="video/mp4" />
          </video>
        </div>
      </section>
    </main>
  </body>
</html>>
